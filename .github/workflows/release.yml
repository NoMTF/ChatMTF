name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: ./gradlew :androidApp:assembleFossRelease --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk "release/ChatMTF-${VERSION}-android.apk"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatMTF-android-apk
          path: release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ChatMTF ${{ github.ref_name }}
          files: release/*.apk
          body: |
            ChatMTF Android 定制版发布。

            - 默认简体中文与轻亮粉蓝白主题
            - 类 Chatbox 的自定义 API 聊天体验
            - 跨对话长期记忆、Soul 工具、MCP、沙盒、任务与多服务 fallback
            - 实验性互动 UI 默认关闭
            - 新增 OCR 配置与 Android 本地 SQLite 存储基础
